<h1>Стенд: подделка «Садовой империи»</h1>
<p>Настоящей игры здесь нет. <code>gardenjs</code>, <code>berechneFelder</code> и
	очередь действий скопированы из её исходника, чтобы полив проверялся против
	правдивого поведения. Жёлтые клетки — те, что <b>можно</b> полить.</p>

<!-- Поддельный ряд кнопок игры. Гном помощника должен встать рядом с лейкой.

<div id="garden"></div>

<!-- Нижняя полоса помощников — ТОЧНО как в живой игре.

       садовый домик   x=0   y=-4  122×129
       сорняк          x=210 y=0   45×37

	<img id="i0" class="wimp wimp3 link" style="position:absolute;left:180px;top:43px;width:30px;height:40px;background:#8a6" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
	<img id="i1" class="wimp wimp3 link" style="position:absolute;left:210px;top:43px;width:30px;height:40px;background:#8a6" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
	<div class="link weed" style="position:absolute;left:210px;top:0;width:45px;height:37px;background:#4a7a35"></div>
	<div id="barkerOpener" class="link" style="position:absolute;left:268px;top:0;width:50px;height:45px;background:#7a6a45"></div>
	<!--
		АВТОМАТ ПОСАДКИ САМОЙ ИГРЫ. На живой игре он есть и рисуется фоном:

				`?zhnec=net` снимает найм: тогда помощник обязан нарисовать
				СВОЮ кнопку сбора, а пока жнец нанят — не должен, иначе в

			<div class="link harvest" style="position:absolute;left:140px;top:0;width:45px;height:45px;background:#5d8f3d"
			     onclick="gardenjs.harvestAll()"></div>
		</div>
	</div>
	<div id="wimpareaCar" class="link car0" style="position:absolute;left:560px;top:0;width:160px;height:55px;background:#6a4a4a"></div>

<script>
	// ?bez_pomoshnikov=1 — проверка запасного пути, когда полосы нет
	if (/[?&]bez_pomoshnikov=1/.test(location.search)) {
		document.getElementById('wimpareaDiv').remove();
	}

	/*

	 *
	 * Блок гномов игры шире и начинается раньше, поэтому просвет за
	 * зазывалой (318–370) закрыт и жуку наверху места НЕТ. Ровно этот

		// находит место там, запасной путь не включается, и проверка
		// зеленеет со сломанным кодом. Поймано мутацией 2026-09-09.
		var w = document.querySelector('#wimpareaDiv .weed');

</script>


<script>
	if (/[?&]bez_leyki=1/.test(location.search)) {
		document.getElementById('giessen').remove();
	}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
// 1. Куски, взятые из игры дословно
// ═══════════════════════════════════════════════════════════════════

// berechneFelder — из wurzel_all.js без изменений (шаг сетки 17, потолок 204)
function berechneFelder(h,q,o,p,s){h=parseInt(h,10);q=parseInt(q,10);o=parseInt(o,10);p=parseInt(p,10);s=parseInt(s,10);var a;if(s==1){a=0}else{if(q==1&&o==1){a=0}else{a=(o-s+1)*17}}var m=h-q-Math.abs(a);var t=new Array();var r=m;var n=0;var l=0;for(var f=0;f<s;f++){l=r+p;for(var d=0;d<p;d++){r++;if(t[n]==null){if(r>204){t[n]=false}else{if((r%17)==0){if(p==1){t[n]=parseInt(r,10)}else{if(r<l){t[n]=parseInt(r,10);var b=l-r;for(var c=1;c<=b;c++){t[n+c]=false}}else{t[n]=parseInt(r,10)}}}else{t[n]=parseInt(r,10)}}}n++}r=m+((f+1)*17)}return t}

function in_array(needle, hay) { return hay.indexOf(needle) !== -1; }

// ═══════════════════════════════════════════════════════════════════
// 2. Обстановка игры
// ═══════════════════════════════════════════════════════════════════

var NOW = Math.floor(Date.now() / 1000);
var Zeit = { Client: NOW, Verschiebung: 0 };
var mode = -1;
var selected = null;

// crop — урожай с растения, price — цена за штуку, growthtime — секунды роста.
// Числа подобраны так, чтобы порядок выгодности был известен заранее.
var data_products = {
	1:  { name: 'Морковь',  category: 'v', sx: 1, sy: 1, plantable: true, crop: 4,  price: 3.0 },
	2:  { name: 'Огурец',   category: 'v', sx: 1, sy: 1, plantable: true, crop: 5,  price: 2.0 },
	7:  { name: 'Тыква',    category: 'v', sx: 2, sy: 2, plantable: true, crop: 20, price: 4.0 },
	40: { name: 'Ёлка',     category: 'z', sx: 1, sy: 1, plantable: true, crop: 1,  price: 99.0 },
	238:{ name: 'Особое',   category: 'v', sx: 1, sy: 1, plantable: true, crop: 9,  price: 9.0 },
	50: { name: 'Сарай',    category: 'u', sx: 1, sy: 1 },
	60: { name: 'Трава',    category: 'h', sx: 1, sy: 1 },
	70: { name: 'Быстрая',  category: 'v', sx: 1, sy: 1, plantable: true, crop: 3, price: 1.0, speedup_reduction: 600 }
};

// Время роста игра держит НЕ в data_products, а в записи полки (`growthtime`,
// приходит с сервера ответом `updatelager`).
var GROWTH = { 1: 3600, 2: 1800, 7: 7200, 40: 3600, 238: 3600, 70: 600 };

// Полка: сколько чего у игрока. Морковь и огурец есть, тыквы мало.
var SHELF = { 1: 40, 2: 10, 7: 1 };

var regal = {
	getCount: function (pid) { return SHELF[pid] || 0; },
	setCount: function (pid, n) { SHELF[pid] = n; },
	decrementCount: function (pid, n) { SHELF[pid] = (SHELF[pid] || 0) - (n || 1); },
	isEmpty: function () { for (var k in SHELF) { if (SHELF[k] > 0) return false; } return true; },
	getCategory: function (pid) { return data_products[pid] ? data_products[pid].category : false; },
	getProductInfos: function (pid) {
		var d = data_products[pid];
		if (!d) return { sx: 1, sy: 1 };
		var out = { sx: d.sx, sy: d.sy, category: d.category, name: d.name };
		if (GROWTH[pid]) out.growthtime = GROWTH[pid];
		return out;
	},
	selectProduct: function (pid) { selected = pid; mode = 0; }
};

function selectMode(d, a, c, b) { mode = d; }

// ═══════════════════════════════════════════════════════════════════
// 3. Сад: нарочно разнообразный, чтобы проверка была осмысленной
// ═══════════════════════════════════════════════════════════════════

var _grid = {};
var _elements = {};  // разметка клеток: у каждой своя фаза роста в `b.alt`
var EXPECTED = [];   // клетки, которые ДОЛЖНЫ политься (по одной на растение)

// Пересобрать разметку под нынешний сад. Фаза: созрело — "6", растёт — "3",
// пусто — "0". Отдельно умеем поставить рассинхрон: клетка по данным
// созрела, а картинка говорит «не выросло» — на такой игра спросит окном.
function _rebuildElements(рассинхрон) {
	var now = Zeit.Client - Zeit.Verschiebung;
	_elements = {};
	for (var i = 1; i <= 204; i++) {
		var c = _grid[i], alt = '0';
		if (c && c.pid) alt = (c.finished && c.finished <= now) ? '6' : '3';
		if (рассинхрон && рассинхрон.indexOf(i) !== -1) alt = '0';
		_elements[i] = { b: { alt: alt } };
	}
}

(function buildGarden() {
	var i;
	function empty(n) { _grid[n] = { pid:0, category:'', water:0, finished:0, x:1, y:1, sx:1, sy:1 }; }
	for (i = 1; i <= 204; i++) empty(i);

	function plant(n, pid, opts) {
		var p = data_products[pid];
		_grid[n] = {
			pid: pid, category: p.category,
			water: opts.water, finished: opts.finished,
			x: 1, y: 1, sx: p.sx, sy: p.sy
		};
	}

	var DRY = NOW - 90000;      // полито больше суток назад — можно поливать
	var WET = NOW - 3600;       // полито час назад — нельзя
	var GROW = NOW + 7200;      // ещё растёт
	var DONE = NOW - 60;        // уже созрело — поливать нечего

	// ── РАССТАНОВКА ВЫВЕРЕНА, НЕ МЕНЯТЬ БЕЗДУМНО ─────────────────────
	// Игра сбрасывает очередь, накопив шесть действий. Тыква 2×2 поставлена
	// ШЕСТОЙ нарочно: очередь опустеет ровно после неё, собственный отсев игры
	// (`alreadyQueued`) перестанет её защищать — и если наш код не отметит все
	// четыре клетки растения, тыква уйдёт на сервер дважды.
	// Прежняя расстановка ставила тыкву одиннадцатой, и проверка проходила даже
	// с нарочно сломанным отсевом: ложный зелёный, пойман 2026-09-09.

	// 1–5: пять обычных овощей под полив
	[1, 2, 3, 4, 5].forEach(function (n) {
		plant(n, 1, { water: DRY, finished: GROW });
		EXPECTED.push(n);
	});

	// 6-е действие: тыква 2×2 на клетках 30,31,47,48 — ровно на сбросе пачки
	[30, 31, 47, 48].forEach(function (n, idx) {
		plant(n, 7, { water: DRY, finished: GROW });
		_grid[n].x = (idx % 2) + 1;
		_grid[n].y = Math.floor(idx / 2) + 1;
	});
	EXPECTED.push(30);

	// ещё шесть овощей после неё
	[100, 101, 102, 103, 104, 105].forEach(function (n) {
		plant(n, 1, { water: DRY, finished: GROW });
		EXPECTED.push(n);
	});

	// ── ОПАСНЫЕ КЛЕТКИ: помощник обязан обойти их стороной ──────────
	plant(13, 50, { water: DRY, finished: GROW });   // постройка → диалог сноса с ценой
	plant(14, 60, { water: DRY, finished: GROW });   // трава с сорняком → молчаливая прополка
	_grid[14].weed = true;
	plant(15, 70, { water: DRY, finished: GROW });   // ускорение → диалог подтверждения

	// 5 недавно политых — нельзя
	[6, 7, 8, 23, 24].forEach(function (n) { plant(n, 1, { water: WET, finished: GROW }); });

	// 4 созревших — нельзя
	[9, 10, 25, 26].forEach(function (n) { plant(n, 2, { water: DRY, finished: DONE }); });

	// 2 не-овоща (category 'z') — нельзя
	[11, 27].forEach(function (n) { plant(n, 40, { water: DRY, finished: GROW }); });

	// 1 растение из списка исключений игры — нельзя
	plant(12, 238, { water: DRY, finished: GROW });

	/*
	 * ОПАСНОЕ, КОТОРОЕ ПО ДАННЫМ СОЗРЕЛО. Без этого стенд был добрее игры:
	 * постройка и сорняк стояли «растущими», сбор до них не доходил вовсе —
	 * и проверка «сбор смотрит на вид растения» зеленела на сломанном коде.
	 * У самой игры ветки сноса и прополки срабатывают ДО проверки режима и
	 * ДО всякой спелости, то есть достать их можно в любой момент.
	 */
	plant(16, 50, { water: DRY, finished: DONE });   // постройка → платный снос
	plant(17, 60, { water: DRY, finished: DONE });   // трава с сорняком → прополка
	_grid[17].weed = true;
})();

/*
 * ═══ ОСТАЛЬНЫЕ САДЫ ═══════════════════════════════════════════════
 *
 * У живого игрока их пять, и в каждом своя работа (замер 2026-09-14: по 204
 * созревших в каждом). Здесь сады 2–5 нарочно МАЛЕНЬКИЕ по делу: обход
 * проверяется на том, что он их посещает и делает в каждом ровно своё, а не
 * на объёме. Остальные клетки заняты растущим и недавно политым — с ними
 * делать нечего.
 *
 * Ожидаемое за обход по садам 1–5, когда семена НЕ выбраны:
 *   собрано 4+2+1+0+3 = 10, полито 12+1+2+1+0 = 16.
 */
var _gardens = { 1: _grid };
var СОЗРЕЛО = { 2: [1, 2], 3: [1], 4: [], 5: [1, 2, 3] };
var СУХО    = { 2: [50],   3: [50, 51], 4: [50], 5: [] };

(function buildOtherGardens() {
	var DRY = NOW - 90000, WET = NOW - 3600, GROW = NOW + 7200, DONE = NOW - 60;
	for (var g = 2; g <= 5; g++) {
		var grid = {};
		for (var i = 1; i <= 204; i++) {
			// по умолчанию — растёт и недавно полито: трогать нечего
			grid[i] = { pid: 1, category: 'v', water: WET, finished: GROW,
			            x: 1, y: 1, sx: 1, sy: 1 };
		}
		СОЗРЕЛО[g].forEach(function (n) {
			grid[n] = { pid: 1, category: 'v', water: WET, finished: DONE,
			            x: 1, y: 1, sx: 1, sy: 1 };
		});
		СУХО[g].forEach(function (n) {
			grid[n] = { pid: 1, category: 'v', water: DRY, finished: GROW,
			            x: 1, y: 1, sx: 1, sy: 1 };
		});
		_gardens[g] = grid;
	}
})();

// ═══════════════════════════════════════════════════════════════════
// 4. gardenjs — поведение скопировано с настоящего
// ═══════════════════════════════════════════════════════════════════

window.__sent = [];       // что ушло бы на сервер
window.__danger = [];     // побочные действия, которых быть не должно
window.__planted = [];    // что ушло бы на посадку
window.__cacheCalls = 0;  // сколько раз дёрнули cache

/*
 * САДЫ. По умолчанию у игрока их пять, а своей быстрой навигации у игры
 * на странице НЕТ — ровно случай игрока: `quicknavi.data` игра
 * заполняет, но рисовать некуда, потому что блока `#quicknavi` нет.
 *   ?sady_igry=1        — у игры свои кнопки есть, наши не нужны
 *   ?sady_neizvestny=1  — данных нет; спросить можно только нажатием
 */
window.__gardenSwitches = [];
window.__sadov = 5;
var quicknavi = { data: {} };
if (!/[?&]sady_neizvestny=1/.test(location.search)) {
	for (var _g = 1; _g <= window.__sadov; _g++) quicknavi.data['garden' + _g] = _g;
	quicknavi.data.greenhouse = 1;   // не сад: в ряд попасть не должно
	quicknavi.data.watergarden = 1;  // водный сад у игрока есть — обход обязан его пройти
	/*
	 * Грибы и улитки. Игра перечисляет в быстрой навигации только то, что
	 * игроку доступно, — и мы рисуем кнопку лишь на такое. Режим
	 * `?net_gribov_i_ulitok=1` убирает их: так выглядит игрок, у которого
	 * этих мест нет, и кнопок ему рисовать нельзя.
	 */
	if (!/[?&]net_gribov_i_ulitok=1/.test(location.search)) {
		quicknavi.data.megafruit = 1;
		quicknavi.data.snailracing = 1;
	}
	// Ноль игра считает «нельзя»: у себя рисует иконку без действия.
	quicknavi.data.mine = 0;
}

// Куда игрок перешёл и что открыл. Проверки смотрят сюда.
window.__gdeMy = [];
window.__otkryto = [];
function setLocation(key) { window.__gdeMy.push(key); }
function initMegafruit() { window.__otkryto.push('megafruit'); }
var snailracing = { init: function () { window.__otkryto.push('snailracing'); } };
if (/[?&]sady_igry=1/.test(location.search)) {
	var qn = document.createElement('div');

window.__wgCacheCalls = 0;
window.WG_EXPECTED = [];        // клетки, которые ДОЛЖНЫ политься (по одной на растение)
window.WG_FREE_WATER = [];      // свободные клетки «вода» — куда можно сажать

(function buildWaterGarden() {
	var n;

	// Разметка поля: верхний и нижний ряд — берег, середина — вода,
	// три клетки закрыты вовсе.
	var BLOCKED = [100, 101, 102];
	for (n = 1; n <= 204; n++) {
		if (BLOCKED.indexOf(n) !== -1) watergarden.gridDefinition[n] = 'blocked';
		else if (n <= 17 || n >= 188) watergarden.gridDefinition[n] = 'edge';
		else watergarden.gridDefinition[n] = 'water';
	}

	function put(cell, pid, age, wateredAt, ripeAt, x, y) {
		var a = [];
		a[0] = pid; a[1] = x || 1; a[2] = y || 1;
		a[3] = ripeAt; a[4] = wateredAt || 0;
		a[10] = age; a[11] = 0;
		watergarden.grid[cell] = a;
	}

	// ── что растёт ───────────────────────────────────────────────
	put(20, 300, 1000, 0, 3600);              // не поливали ни разу → ПОЛИТЬ
	put(21, 300, 90000, 89000, 200000);       // полили час назад → нельзя
	put(22, 301, 500, 0, 7200, 1, 1);         // лотос 2×1, левая половина → ПОЛИТЬ
	put(23, 301, 500, 0, 7200, 2, 1);         // его же правая половина
	put(24, 300, 4000, 0, 3600);              // созрело → не поливаем
	put(25, 304, 500, 0, 999999);             // СОРНЯК — не трогать вовсе
	put(26, 303, 500, 0, 999999);             // украшение — не трогать
	put(5,  302, 100, 0, 1800);               // камыш на берегу → ПОЛИТЬ

	// ── СОЗРЕВШЕЕ: то, что сбор обязан взять ──────────────────────
	put(40, 300, 5000, 0, 3600);              // созрело → СОБРАТЬ
	put(41, 300, 5000, 0, 3600);              // созрело → СОБРАТЬ
	// клетка 24 уже созрела выше (возраст 4000 при спелости 3600)

	/*
	 * ЛОВУШКА: СОЗРЕВШИЙ СОРНЯК. По возрасту он «поспел», и сбор без
	 * проверки вида полез бы в него — а уборка сорняка в водном саду
	 * платная (`watergardenRemoveWeedCosts`). Без этой клетки стенд был бы
	 * добрее игры: сорняк 25 никогда не поспевает и до него не доходит.
	 */
	put(45, 304, 5000, 0, 1000);

	window.WG_EXPECTED = [5, 20, 22];
	window.WG_SOZRELO = [24, 40, 41];

	for (n = 1; n <= 204; n++) {
		if (watergarden.gridDefinition[n] !== 'water') continue;
		if (watergarden.grid[n] && watergarden.grid[n][0]) continue;
		window.WG_FREE_WATER.push(n);
	}

	// ── разметка клеток: #wgGrid<N>, как в игре ──────────────────
	var g = document.getElementById('wgGrid'), el, i;
	for (i = 1; i <= 204; i++) {
		el = document.createElement('div');
		el.id = 'wgGrid' + i;
		el.style.cssText = 'width:26px;height:26px;font:9px monospace;display:flex;'
			+ 'align-items:center;justify-content:center;color:#cfe';
		var kind = watergarden.gridDefinition[i];
		el.style.background = kind === 'blocked' ? '#1b2833' : (kind === 'edge' ? '#4a5a3a' : '#1d4a6b');
		if (watergarden.grid[i] && watergarden.grid[i][0]) {
			el.textContent = i;
			el.style.background = '#2a7ba8';
		}
		g.appendChild(el);
	}

	if (WG_ON) {
		document.getElementById('watergarden_container').style.display = 'block';
		document.getElementById('garden').style.display = 'none';
		watergarden.open();
		// Полка водного сада: выбираем кувшинку, как сделала бы игра.
		selected = 300;
		mode = 0;
	}

	console.log('водный сад: ожидается политых —', window.WG_EXPECTED.length, window.WG_EXPECTED,
		'| свободных клеток воды —', window.WG_FREE_WATER.length);
})();

// ── ЛОВУШКА: обычный сад, пока открыт водный ─────────────────────────
// В настоящей игре `gardenjs` остаётся заряжен ПРЕДЫДУЩИМ садом, а игрок его
// не видит. Любое действие через него — действие вслепую по чужому саду.
(function guardNormalGarden() {
	var real = gardenjs.action.cache;
	gardenjs.action.cache = function (n) {
		if (watergarden.isOpen) {
			window.__danger.push('обычный сад тронут ' + n);
			return false;
		}
		return real.apply(this, arguments);
	};
})();
</script>

			for (var p in hd.bird.feed) {

	my.buyBird = function (h, type) {

<script>
// ═══════════════════════════════════════════════════════════════════
// 7. Попрошайки — по объекту `wimparea` из wurzel_all.js
//
// Главное, что стенд обязан повторить: игра ДЕРЖИТ КЭШ листков
// (`q[i].sheet`). Второй раз на сервер она не ходит, а значит перехват
// одного лишь ajax листка не увидит. Если стенд не кэширует, проверка
// зеленеет на коде, который у живого игрока молчал бы через раз.
// ═══════════════════════════════════════════════════════════════════

// Деньги печатаются форматом игры — number_format скопирована из её исходника.
// Порядок как в игре: number_format(сумма, 2, t_price[1] — разделитель
// дробной части, t_price[3] — разделитель тысяч). По-русски: «8.673,08 сТ».
var t_price = ['', ',', 'сТ', '.'];
function number_format(t,w,q,u){var x=t,y=w;x=!isFinite(+x)?0:+x;y=!isFinite(+y)?0:Math.abs(y);var n=(typeof u=="undefined")?",":u;var v=(typeof q=="undefined")?".":q;var o=(y>0)?x.toFixed(y):Math.round(x).toFixed(y);var p=Math.abs(x).toFixed(y);var r,s;if(p>=1000){r=p.split(/\D/);s=r[0].length%3||3;r[0]=o.slice(0,s+(x<0))+r[0].slice(s).replace(/(\d{3})/g,n+"$1");o=r.join(v)}else{o=o.replace(".",v)}return o}
function formatMoney(a){ return number_format(a, 2, t_price[1], t_price[3]) + '&nbsp;' + t_price[2]; }

// Бонус к сумме попрошайки: игра умножает на (1 + доля) и округляет вверх.
// Включается ?bonus=1 — на нём проверяется, что процент считается от того же
// числа, которое видит игрок, а не от голой суммы.
var specialbonus = /[?&]bonus=1/.test(location.search)
	? { data: { wimps: { money: 0.2 } } }
	: null;

// Листки попрошаек. Цены товаров — из data_products: морковь 3, огурец 2,
// тыква 4. На полке 40 моркови, 10 огурцов, 1 тыква.
var WIMP_SHEETS = {
	// 10×3 + 5×2 = 40 «по цене игры», предлагают 48 → +20 %, всё есть
	11: { id: 11, sum: 48, neighbours: [-1, 12],
		products: [ { pid: 1, amount: 10, name: 'Морковь' },
		            { pid: 2, amount: 5,  name: 'Огурец'  } ] },
	// 20×4 = 80 «по цене игры», предлагают 60 → −25 %, тыквы не хватает 19
	12: { id: 12, sum: 60, neighbours: [11, -1],
		products: [ { pid: 7, amount: 20, name: 'Тыква' } ] }
};

window.__wimpAsks = 0;     // сколько раз ходили на сервер за листком

var wimparea = (function () {
	var p = {};
	var q = { 11: { id: 11, sheet: null }, 12: { id: 12, sheet: null } };

	// На живой игре (проверено 2026-09-11) листки приходят ВМЕСТЕ с садом, и
	// `verkaufajax` не вызывается ни разу. Режим `?listki=srazu` это и
	// воспроизводит: у попрошаек сразу есть `sheet`, ходить некуда.
	if (/[?&]listki=srazu/.test(location.search)) {
		for (var __k in q) { if (WIMP_SHEETS[__k]) q[__k].sheet = WIMP_SHEETS[__k]; }
	}

	// show — из игры: если листок уже приходил, второй раз не спрашиваем.
	p.show = function (z) {
		document.getElementById('einkaufszettel').style.display = 'block';

		function y(B) {
			q[B.id].sheet = B;                     // кэш игры
			var F = '', C, I = true, H;
			for (C = 0; C < B.products.length; C++) {
				if (regal.getCount(B.products[C].pid) >= B.products[C].amount) { H = 'blau'; }
				else { H = 'rot'; I = false; }
				F += '<div class="' + H + '">' + B.products[C].amount + ' x ' + B.products[C].name + '</div>';
			}
			document.getElementById('wimpVerkaufProducts').innerHTML = F;

			var D = B.sum, G = 0;
			if (specialbonus && specialbonus.data && specialbonus.data.wimps
				&& specialbonus.data.wimps.money) { G += specialbonus.data.wimps.money; }
			if (G > 0) { D = Math.ceil(B.sum * (1 + G)); }
			document.getElementById('wimpVerkaufSumAmount').innerHTML = formatMoney(D);

			var yes = document.getElementById('wimpVerkaufYes');
			if (I) { yes.className = ''; } else { yes.className = 'inactive'; }
		}

		if (q[z].sheet) { y(q[z].sheet); }
		else {
			ajax.request('verkaufajax', { 'do': 'getData', id: z, garden: window.currentGarden }, y);
		}
	};

	p.close = function () { document.getElementById('einkaufszettel').style.display = 'none'; };
	return p;
})();
</script>

var __zaprosyRynka = [];

	6:  [['14.946', 'морковь', 'FISHgarden', '0,08 сT', '1.195,68 сT'],

	// подрезать некуда, помощник обязан упереться в min, а не уйти в 0,01.

	     ['2.231', 'салат', 'FISHgarden', '0,10 сT', '223,10 сT']],

var _nastoyashchiyFetch = window.fetch;
window.fetch = function (url, opts) {
	var s = String(url);
	if (s.indexOf('/stadt/markt.php') !== -1) {

		var pid = m ? parseInt(m[1], 10) : 0;
		__zaprosyRynka.push(pid);

		for (var i = 0; i < rows.length; i++) {
			html += '<tr><td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td><td>' +
				rows[i][2] + '</td><td>' + rows[i][3] + '</td><td>' + rows[i][4] +
				'</td><td>слишком дорого!</td></tr>';
		}
		html += '</table>';
		return Promise.resolve(new Response(html, { status: 200,
			headers: { 'Content-Type': 'text/html' } }));
	}
	return _nastoyashchiyFetch.apply(window, arguments);
};
</script>
